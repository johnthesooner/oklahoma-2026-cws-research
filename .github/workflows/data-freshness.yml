name: data-freshness

# CI proves the report regenerates from the committed CSVs. It has never proved the CSVs
# regenerate from their upstreams, which are live and publicly editable. This job does that
# against the network on a schedule, and opens an issue when reality has moved.

on:
  schedule:
    - cron: "0 13 * * 1"      # Mondays 13:00 UTC, after the weekend's games are final
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  verify-against-upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Rebuild seasons and ratings from source and diff against the committed tables
        run: |
          python football/scripts/build_seasons.py --check
          python football/scripts/build_ratings.py --check

      - name: Cross-check every game against ESPN
        run: python football/scripts/crosscheck_espn.py

      - name: Open an issue if upstream has diverged
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data freshness check failed (${new Date().toISOString().slice(0, 10)})`,
              body: [
                "The weekly upstream verification failed. One of:",
                "",
                "- `build_seasons.py --check` — a Wikipedia season infobox no longer matches the committed seasons table",
                "- `build_ratings.py --check` — an ESPN or SP+ source no longer matches the committed ratings",
                "- `crosscheck_espn.py` — a game no longer matches ESPN's feed",
                "",
                "These upstreams are live and publicly editable, so a failure may mean the source changed",
                "rather than that this repo is wrong. Investigate before changing any committed value.",
                "",
                `Run: ${run}`,
              ].join("\n"),
              labels: ["data-quality"],
            })
