name: 'oklahoma_athletics'
version: '1.0.0'
config-version: 2
profile: 'oklahoma_athletics'

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  oklahoma_athletics:
    staging:
      # Materialised as tables, not views. The sources are external CSVs read by relative
      # path, so a view would only resolve when queried from the transform/ directory --
      # tables make oklahoma.duckdb a self-contained artifact anything can open.
      +materialized: table
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
